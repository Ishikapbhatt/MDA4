apiVersion: v1
kind: Pod
metadata:
  name: my-pod-a1
  labels:
    app: my-pod-a1
spec:
  containers:
    - name: my-container
      image: nginx
      ports:
        - containerPort: 80

---


apiVersion: v1
kind: Service
metadata:
  name: my-service-a1
spec:
  type: LoadBalancer
  selector:
    app: my-pod-a1
  ports:
    - port: 80
      targetPort: 80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-deployment
spec:
  replicas: 3

  selector:
    matchLabels:
      app: myapp 
      
  template:
    metadata:
      labels:
        app: myapp
        version: blue
    spec:
      containers:
        - name: blue-container
          image: nginx
          ports:
            - containerPort: 80
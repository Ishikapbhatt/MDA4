apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-deployment
spec:
  replicas: 1

  selector:
    matchLabels:
      app: myapp
      version: canary

  template:
    metadata:
      labels:
        app: myapp
        version: canary
    spec:
      containers:
        - name: canary-container
          image: ishika979/super-mario:latest
          ports:
            - containerPort: 80
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myapp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myapp-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 30




# Command to increase the HPA : kubectl autoscale deployment myapp-deployment --cpu-percent=50 --min=1 --max=10


# Get pod names
# kubectl get pods -l app=myapp

# Exec into a pod and generate CPU stress
 # kubectl exec -it <pod-name> -- /bin/bash
# Inside: apt-get update && apt-get install -y stress && stress --cpu 2 --timeout 300s
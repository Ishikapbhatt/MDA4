apiVersion: v1
kind: Pod
metadata:
  name: myapp-pod
  labels:
    app: myapp
spec:
  containers:
  - name: myapp
    image: nginx
    env:
    - name: USERNAME
      valueFrom:
        secretKeyRef:
          name: myapp-secret
          key: username
          
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          name: myapp-secret
          key: password